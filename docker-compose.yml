name: knowledge-hub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - 'kh-back:latest'
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - 4000:4000
    env_file:
      - .env
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - fastembed_cache:/usr/src/app/local_cache
    networks:
      - backend

  db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - '8080:8080'
    depends_on:
      - db
    profiles:
      - debug
    networks:
      - backend

  qdrant:
    build:
      context: .
      dockerfile_inline: |
        FROM qdrant/qdrant:latest
        RUN apt-get update -yq && apt-get install -yqq curl
    ports:
      - '6333:6333'
      - '6334:6334'
    env_file:
      - .env
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: curl -s http://localhost:6333/healthz | grep -q 'healthz check passed' || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

volumes:
  fastembed_cache:
  db-data:
  qdrant_storage:

networks:
  backend:
    driver: bridge
